      identity_role: REQUIRED_OR_NA
      screen_position: REQUIRED_OR_NA
      pose: REQUIRED_OR_NA
      gaze_expression: REQUIRED_OR_NA
      upper_garment: REQUIRED_OR_NA
      lower_garment: REQUIRED_OR_NA
      legwear: REQUIRED_OR_NA
      footwear: REQUIRED_OR_NA
      bag_accessories: REQUIRED_OR_NA
      forbidden_source_garments: []
