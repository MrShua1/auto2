output:
  independent_master: true
  aspect_ratio: "16:9"
  target_size: REQUIRED
  contact_sheet_after_approval: true
lint:
  status: BLOCKED_UNTIL_PASS
  user_direction_lock_match: REQUIRED_PASS
  applicable_skills: []
  n_a_skills_with_reason: []
