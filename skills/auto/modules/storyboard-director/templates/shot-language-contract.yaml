  weather_period: REQUIRED
  continuity_reference: REQUIRED_OR_NA
lighting:
  key_source: REQUIRED
  direction: REQUIRED
  color_temperature: REQUIRED
  fill_level: REQUIRED
  shadow_behavior: REQUIRED
  reflection_behavior: REQUIRED_OR_NA
