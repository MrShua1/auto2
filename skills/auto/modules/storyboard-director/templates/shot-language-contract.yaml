  focal_length_mm: REQUIRED
  lens_behavior: REQUIRED
  aperture_or_depth_behavior: REQUIRED
  camera_height: REQUIRED
  angle: REQUIRED
  composition: REQUIRED
  visual_center: REQUIRED
  subject_placement: REQUIRED
  screen_direction: REQUIRED
  future_movement:
